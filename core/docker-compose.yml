services:
  broker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flux-broker
    ports:
      - "9092:9092"
    environment:
      FLUX_LISTEN_ADDR: ":9092"
      FLUX_DATA_DIR: "/app/data"
      FLUX_NUM_PARTITIONS: "3"
    volumes:
      - flux_data:/app/data
    restart: unless-stopped

volumes:
  flux_data:
